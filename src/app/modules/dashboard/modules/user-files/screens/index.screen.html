<article @fade class="p-2">

        class="flex item h-12 md:h-16 gap-4 items-center md:px-2 md:pb-4 px-1 pb-2"
    >
        <p
            class="text-3xl cursor-pointer tooltip tooltip-bottom"
            data-tip="Back"
        >
            <
        </p>
        <h1 class="text-base md:text-xl font-bold">My Files</h1>

    </ng-container>
</article>
