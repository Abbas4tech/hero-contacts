<article @fade class="p-2">
    <section
        class="flex item h-12 md:h-16 gap-4 items-center md:px-2 md:pb-4 px-1 pb-2"
    >
        <p
            class="text-3xl cursor-pointer tooltip tooltip-bottom"
            data-tip="Back"
        >
            <
        </p>
        <h1 class="text-base md:text-xl font-bold">My Files</h1>
    </section>
    <hr />

    <input
        type="file"
        (change)="detectFiles($event)"
        class="file-input w-full max-w-xs"
    />

    <button class="btn btn-primary" (click)="uploadSingleFile()">Upload</button>

    <ng-container *ngFor="let image of images">
        <a [href]="image" download target="_blank">Download</a>
        <div class="avatar">
            <div class="w-24 rounded">
                <img [src]="image" />
            </div>
        </div>
    </ng-container>
</article>
