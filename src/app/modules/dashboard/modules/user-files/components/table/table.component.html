<div
    *ngIf="showConsent"
    role="alert"
    class="alert font-semibold text-sm md:w-max alert-info"
>
    <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        class="h-6 w-6 shrink-0 stroke-current"
    >
        <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
        ></path>
    </svg>
    <span>We only Support Image formats like JPG, PNG etc as of now.</span>
    <div class="cursor-pointer" (click)="closeConsent()">
        <svg
            stroke="currentColor"
            fill="currentColor"
            stroke-width="0"
            viewBox="0 0 512 512"
            height="2em"
            width="2em"
            xmlns="http://www.w3.org/2000/svg"
        >
            <path
                d="M278.6 256l68.2-68.2c6.2-6.2 6.2-16.4 0-22.6-6.2-6.2-16.4-6.2-22.6 0L256 233.4l-68.2-68.2c-6.2-6.2-16.4-6.2-22.6 0-3.1 3.1-4.7 7.2-4.7 11.3 0 4.1 1.6 8.2 4.7 11.3l68.2 68.2-68.2 68.2c-3.1 3.1-4.7 7.2-4.7 11.3 0 4.1 1.6 8.2 4.7 11.3 6.2 6.2 16.4 6.2 22.6 0l68.2-68.2 68.2 68.2c6.2 6.2 16.4 6.2 22.6 0 6.2-6.2 6.2-16.4 0-22.6L278.6 256z"
            ></path>
        </svg>
    </div>
</div>

<div class="grid grid-cols-2 lg:grid-cols-4 xl:grid-cols-5 gap-4 mt-4">
    <ng-container *ngFor="let item of files">
        <div
            class="bg-base-200 min-h-48 flex flex-col justify-between rounded-sm cursor-pointer"
        >
            <img
                (click)="showDetails(item.name)"
                [src]="item.url"
                class="max-h-40 p-4 w-full rounded-sm object-cover"
                [alt]="item.name"
            />
            <div class="flex items-center bg-base-300 justify-between gap-4">
                <div class="text-sm p-2 truncate md:text-base font-semibold">
                    {{ item.name }}
                </div>
                <div
                    class="dropdown menu-dropdown-show dropdown-bottom dropdown-end"
                >
                    <div
                        tabindex="0"
                        role="button"
                        class="my-1 mx-2 cursor-pointer"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="1em"
                            height="1em"
                            viewBox="0 0 24 24"
                            class="fill-current"
                        >
                            <g clip-path="url(#clip0_105_1875)">
                                <rect
                                    height="0.01"
                                    stroke="#292929"
                                    stroke-linejoin="round"
                                    stroke-width="3"
                                    width="0.01"
                                    x="12"
                                    y="12"
                                />

                                <rect
                                    height="0.01"
                                    stroke="#292929"
                                    stroke-linejoin="round"
                                    stroke-width="3"
                                    width="0.01"
                                    x="12"
                                    y="5"
                                />

                                <rect
                                    height="0.01"
                                    stroke="#292929"
                                    stroke-linejoin="round"
                                    stroke-width="3"
                                    width="0.01"
                                    x="12"
                                    y="19"
                                />
                            </g>

                            <defs>
                                <clipPath id="clip0_105_1875">
                                    <rect
                                        fill="white"
                                        height="24"
                                        transform="translate(0 0.000976562)"
                                        width="24"
                                    />
                                </clipPath>
                            </defs>
                        </svg>
                    </div>
                    <ul
                        tabindex="0"
                        class="dropdown-content menu bg-base-200 rounded-box z-10 w-52 p-2 shadow-lg"
                    >
                        <li
                            (click)="deleteFile(item.fullPath)"
                            class="text-error font-semibold"
                        >
                            <a>Delete</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </ng-container>
</div>
