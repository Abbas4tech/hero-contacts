<header
    class="sticky container mx-auto top-0 z-30 shadow-lg shadow-base-300 text-base-content"
>
    <nav class="navbar bg-base-100 h-10 md:h-20">
        <div class="navbar-start">
            <label
                tabindex="{0}"
                class="btn btn-ghost btn-circle drawer-button lg:hidden"
                for="my-drawer-2"
            >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="h-5 w-5"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                >
                    <path
                        strokeLinecap="round"
                        strokeLinejoin="round"
                        strokeWidth="2"
                        d="M4 6h16M4 12h16M4 18h7"
                    />
                </svg>
            </label>

            <div class="avatar mx-4 hidden lg:block">
                <div class="w-12 cursor-pointer rounded-full">
                    <img
                        alt="profile-picture"
                        loading="lazy"
                        [src]="loggedInUser.photoURL"
                        referrerpolicy="no-referrer"
                    />
                </div>
            </div>

            <h1
                class="text-lg normal-case lg:text-2xl btn btn-md btn-ghost p-2"
            >
                <a href="/" class="cursor-pointer text-base-content"
                    >Welcome {{ loggedInUser.displayName }} !!</a
                >
            </h1>
        </div>

        <div class="navbar-end gap-4 px-4">
            <button
                (click)="logout()"
                data-tip="Logout"
                class="tooltip tooltip-bottom"
            >
                <svg
                    class="w-5 h-5 md:w-8 md:h-8"
                    stroke="currentColor"
                    fill="currentColor"
                    stroke-width="0"
                    viewBox="0 0 24 24"
                    height="1em"
                    width="1em"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <path fill="none" d="M0 0h24v24H0z"></path>
                    <path
                        d="m17 7-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"
                    ></path>
                </svg>
            </button>
            <theme-toggler panelClass="text-base-content"></theme-toggler>
        </div>
    </nav>
</header>
<div
    class="w-full wrapper container overflow-hidden md:text-lg text-base mx-auto"
>
    <div class="drawer lg:drawer-open">
        <input id="my-drawer-2" type="checkbox" class="drawer-toggle" />
        <div class="drawer-content scrollbar-hide overflow-y-auto p-2 md:p-4">
            <ng-container *ngIf="contentLoaded; else loader">
                <page-wrapper>
                    <div class="router">
                        <router-outlet></router-outlet>
                    </div>
                </page-wrapper>
            </ng-container>
        </div>
        <div class="drawer-side top-16">
            <label
                for="my-drawer-2"
                aria-label="close sidebar"
                class="drawer-overlay"
            ></label>
            <ul
                class="menu bg-base-200 lg:w-40 text-base-content min-h-full p-0 pt-4 w-[80%] xl:w-80"
            >
                <li
                    class="py-1 md:py-2 pr-2 cursor-pointer aos-init aos-animate"
                >
                    <a
                        (click)="closeSidebar()"
                        routerLink="/dashboard/contacts"
                        class="px-4 py-2 text-lg md:py-3 w-full !rounded-none flex gap-2 items-center bg-base-200 transform duration-200 ease-out"
                        routerLinkActive="border-primary border-l-4 bg-base-200 font-bold"
                        >Contacts</a
                    >
                </li>

                <li
                    class="py-1 md:py-2 pr-2 cursor-pointer aos-init aos-animate"
                >
                    <a
                        (click)="closeSidebar()"
                        routerLink="/dashboard/profile"
                        [routerLinkActiveOptions]="{ exact: true }"
                        class="px-4 py-2 text-lg md:py-3 w-full !rounded-none flex gap-2 items-center bg-base-200 transform duration-200 ease-out"
                        routerLinkActive="border-primary border-l-4 bg-base-200 font-bold"
                        >Profile</a
                    >
                </li>

                <li
                    class="py-1 md:py-2 pr-2 cursor-pointer aos-init aos-animate"
                >
                    <a
                        (click)="closeSidebar()"
                        routerLink="/dashboard/files"
                        class="px-4 py-2 text-lg md:py-3 w-full !rounded-none flex gap-2 items-center bg-base-200 transform duration-200 ease-out"
                        routerLinkActive="border-primary border-l-4 bg-base-200 font-bold"
                        >Files</a
                    >
                </li>
            </ul>
        </div>
    </div>
</div>
<ng-template #loader>
    <section class="h-[92vh] flex justify-center items-center">
        <progress class="progress progress-primary w-56"></progress>
    </section>
</ng-template>
